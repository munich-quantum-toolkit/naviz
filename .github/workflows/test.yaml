name: Test

# This workflow tests the code on multiple platforms.

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CACHE_KEY: test

jobs:
  test:
    strategy:
      matrix:
        include:
          - image: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - image: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - image: macos-26
            target: aarch64-apple-darwin
          - image: macos-26-intel
            target: x86_64-apple-darwin
          - image: windows-2025
            target: x86_64-pc-windows-msvc
          - image: windows-11-arm
            target: aarch64-pc-windows-msvc
      fail-fast: false
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python Toolchain
        # Setup a compatible python-toolchain for the python-bindings
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
          cache-key: ${{ env.CACHE_KEY }}-${{ matrix.target}}
          target: ${{ matrix.target }}
          rustflags: "" # Don't fail on warnings
      - name: Run Rust Tests
        run: cargo test --color=always --all-features --target=${{ matrix.target }}
