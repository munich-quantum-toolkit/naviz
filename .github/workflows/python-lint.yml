name: 🐍 Lint

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-linter:
    name: 🐍 Lint
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@579203ef22082fa5d5483412f442e50d0c5ff4a7 # v2.2.2
    with:
      enable-mypy: false
      enable-ty: true
  check-stubs:
    name: 🐍 Check stubs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust Toolchain
        # The Python bindings are a Rust extension module, so the tests need a compiler.
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-key: lint-python
          rustflags: "" # Don't fail on warnings
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Check stubs
        run: |
          uvx nox -s stubs
          if [[ $(git status --porcelain python) ]]; then
            echo "Stub files are not up to date. Please run 'nox -s stubs' and commit the changes."
            git --no-pager diff python
            exit 1
          fi
