name: 🐍 Lint

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  python-linter:
    name: 🐍 Lint
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9
    with:
      enable-mypy: false
      enable-ty: true
    permissions:
      contents: read

  check-stubs:
    name: 🐍 Check stubs
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust Toolchain
        # The Python bindings are a Rust extension module, so the tests need a compiler.
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-key: lint-python
          build-warnings: warn # Don't fail on warnings
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check stubs
        run: |
          uvx nox -s stubs
          if [[ $(git status --porcelain python) ]]; then
            echo "Stub files are not up to date. Please run 'nox -s stubs' and commit the changes."
            git --no-pager diff python
            exit 1
          fi
