name: Templating
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/templating.yml"
  workflow_dispatch: # Allow manual triggering

permissions: {}

jobs:
  render-template:
    name: Render template
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read-release-drafter-categories
        run: |
          JSON_CONTENT=$(cat .github/workflow_inputs/release_drafter_categories.json | jq -c .)
          echo "release_drafter_categories=$JSON_CONTENT" >> $GITHUB_OUTPUT
      - id: create-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write # Needed to push the templating branch
          permission-pull-requests: write # Needed to open the templating pull request
      - uses: munich-quantum-toolkit/templates@a0f93d5fad788ca615e2b36043846fe3f200b9be # v1.7.0
        with:
          token: ${{ steps.create-token.outputs.token }}
          name: NAViz
          organization: ${{ github.repository_owner }}
          project-type: other
          repository: ${{ github.event.repository.name }}
          has-changelog-and-upgrade-guide: false
          synchronize-contribution-guide: false
          synchronize-gitignore: false
          synchronize-installation-guide: false
          release-drafter-categories: ${{ steps.read-release-drafter-categories.outputs.release_drafter_categories }}
