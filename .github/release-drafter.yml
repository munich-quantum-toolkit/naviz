# This file has been generated from an external template. Please do not modify it directly.
# Changes should be contributed to https://github.com/munich-quantum-toolkit/templates.

name-template: "MQT NAViz $RESOLVED_VERSION Release"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🧑‍💻 Updates to the CLI"
    when:
      labels:
        - "Area: CLI"
  - title: "📱 Updates to the GUI"
    when:
      labels:
        - "Area: GUI"
  - title: "🐍 Updates to the Python Integration"
    when:
      labels:
        - "Area: Python"
  - title: "📼 Updates to the Video Export"
    when:
      labels:
        - "Area: Video Export"
  - title: "💫 Updates related to animation"
    when:
      labels:
        - "Area: Animation"
  - title: "🔍️ Updates related to file parsing"
    when:
      labels:
        - "Area: File Parser"
  - title: "🔗 Updates related to supported import formats"
    when:
      labels:
        - "Area: Import"
  - title: "🖼️ Updates related to rendering"
    when:
      labels:
        - "Area: Renderer"
  - title: "🔧 Updates related to the machine repository"
    when:
      labels:
        - "Area: Repository"
  - title: "🚀 Features and Enhancements"
    when:
      labels:
        - "enhancement"
        - "feature"
        - "refactor"
        - "usability"
  - title: "🐛 Bug Fixes"
    when:
      labels:
        - "bug"
        - "fix"
  - title: "📄 Documentation"
    when:
      labels:
        - "documentation"
  - title: "🤖 CI & Tooling"
    when:
      labels:
        - "continuous integration"
        - "tooling"
  - title: "📦 Packaging"
    when:
      labels:
        - "packaging"
  - title: "🧹 Code Quality"
    when:
      labels:
        - "code quality"
  - title: "⬆️ Dependencies"
    collapse-after: 5
    when:
      labels:
        - "dependencies"
        - "github-actions"
        - "pre-commit"
        - "submodules"
  - type: "pre-exclude"
    when:
      labels:
        - "skip-changelog"
        - "backport"
        - "release-prep"
  - type: "version-resolver"
    semver-increment: "major"
    when:
      label: "major"
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      label: "minor"
  - type: "version-resolver"
    semver-increment: "patch"
    when:
      label: "patch"
  - type: "version-resolver"
    semver-increment: "patch"
change-template: "- $TITLE ([#$NUMBER]($URL)) (**@$AUTHOR**)"
change-title-escapes: '\<*_&'

template: |
  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
